note: >-
  Belk publishes no OpenAPI, AsyncAPI, GraphQL, gRPC or WSDL contract, so every API-level
  standard (oauth2, oidc, json:api, rfc9457, pagination, idempotency) is unassessable rather
  than false - there is no HTTP API to hold them. The one standard the company genuinely declares
  for its own market is ANSI ASC X12 EDI, version 4030, which is the mandatory supplier
  integration contract ("EDI is mandatory" - EDI Vendor FAQ). The implementation guides are
  PDF-only and routed through a VAN (OpenText Trading Grid; no direct AS2 to Belk), so this is a
  domain-standard signature carried by published mapping specifications, not by a
  machine-readable contract.
