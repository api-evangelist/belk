  reason: not-a-software-company
  detail: >-
    Belk is a department-store retailer whose only published integration contract is a
    mandatory X12 4030 EDI supplier program (PDF implementation guides, VAN-routed, no direct
    AS2); developer.belk.com is a dangling CNAME into Apigee's legacy devportal edge
    (dev-belk.devportal.apigee.com -> ui-ea.apigee.net, *.apigee.com certificate, 504) and
    api.belk.com is an Akamai edge with a *.test.edgekey.net certificate answering 503, so no
    HTTP API exists to profile.
